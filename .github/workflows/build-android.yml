name: Build Android App

on:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare MaShop icon and Play Store assets
        working-directory: android-app
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable ../android-build-output
          convert assets/mashop-icon.svg -background white -alpha remove -alpha off app/src/main/res/drawable/ic_launcher.png
          convert assets/mashop-icon.svg -background white -alpha remove -alpha off -resize 512x512 ../android-build-output/MaShop-Play-Icon-512.png
          convert assets/mashop-feature.svg -background white -alpha remove -alpha off ../android-build-output/MaShop-Feature-Graphic-1024x500.png

      - name: Prepare upload key
        working-directory: android-app
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > massage-upload-key.jks
            echo "Using the stable upload keystore from GitHub Secrets."
          else
            echo "No stable upload keystore secret is configured; generating a new key for this build."
            keytool -genkeypair -v               -keystore massage-upload-key.jks               -storepass massage2026               -keypass massage2026               -alias massage-upload               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Guidr Thai, OU=Massage Management, O=Guidr Thai, L=Bangkok, ST=Bangkok, C=TH"
          fi

      - name: Build release APK and AAB
        working-directory: android-app
        run: |
          gradle --no-daemon assembleRelease bundleRelease
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$APK_PATH" && test -f "$APK_PATH"
          test -n "$AAB_PATH" && test -f "$AAB_PATH"
          cp "$APK_PATH" ../android-build-output/MaShop-v39.apk
          cp "$AAB_PATH" ../android-build-output/MaShop-v39.aab
          cp massage-upload-key.jks ../android-build-output/MaShop-upload-key.jks
          printf 'Keystore password: massage2026\nAlias: massage-upload\nApplication ID: com.guidrthai.massage\nVersion: 39.0 (39)\n' > ../android-build-output/MaShop-SIGNING-INFO.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mashop-android-v39
          path: android-build-output/
          retention-days: 30
